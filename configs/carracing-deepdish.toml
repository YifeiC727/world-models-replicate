# mlds-deepdish1: paper-scale data, V and M; reduced controller search (6 physical cores).
# Paper controller: population 64 x 16 episodes x 200 generations (~5 days/mode here).

[experiment]
seed = 0
workdir = "runs/carracing-deepdish"

[environment]
episodes = 10000
max_steps = 1000
invert_colors = true

[data]
validation_fraction = 0.1
test_fraction = 0.1

[vae]
latent_size = 32
epochs = 10
batch_size = 100
learning_rate = 0.0001
kl_tolerance = 0.5
shuffle_chunk_episodes = 16

[mdn]
hidden_size = 256
mixtures = 5
sequence_length = 999
# Original rnn_train.py: 4000 steps x batch 100; 8000 train episodes = 80 steps/epoch.
epochs = 50
batch_size = 100
learning_rate = 0.001

[controller]
generations = 100
population = 32
episodes_per_candidate = 8
evaluation_episodes = 100
workers = 6
